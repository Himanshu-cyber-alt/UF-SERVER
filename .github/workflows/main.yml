name: Deploy Unifeed Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t unifeed-server-img .

      - name: Tag Docker image
        run: |
          docker tag unifeed-server-img:latest \
            541739391357.dkr.ecr.ap-south-1.amazonaws.com/unifeed-server-img:latest

      - name: Push image to ECR
        run: |
          docker push \
            541739391357.dkr.ecr.ap-south-1.amazonaws.com/unifeed-server-img:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | \
            docker login --username AWS --password-stdin \
            541739391357.dkr.ecr.ap-south-1.amazonaws.com

            docker pull \
            541739391357.dkr.ecr.ap-south-1.amazonaws.com/unifeed-server-img:latest

            docker stop unifeed || true
            docker rm unifeed || true

            docker run -d \
              --name unifeed \
              --env-file /home/ec2-user/UF-SERVER/.env \
              -p 8000:8000 \
              541739391357.dkr.ecr.ap-south-1.amazonaws.com/unifeed-server-img:latest